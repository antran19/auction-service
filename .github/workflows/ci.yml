name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Wires up ~/.m2/settings.xml so Maven can resolve com.nexus:common-* from
          # antran19/common-libs' GitHub Packages registry.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Tests include Testcontainers-backed integration tests (Postgres, Kafka);
      # ubuntu-latest runners have Docker available by default, no extra setup needed.
      - name: Build and test
        run: mvn -B clean verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
